name: publish

on:
  push:
    tags: ["v*"]

jobs:
  wheels:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Rust on host: used by macOS/Windows (cibuildwheel runs natively).
      # Linux uses Docker containers — Rust is installed via before-all in pyproject.toml.
      - uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64 target for macOS cross-compilation
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - uses: pypa/cibuildwheel@v3.4
        with:
          output-dir: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  smoke-test:
    needs: [wheels, sdist]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links=dist/ --no-index --only-binary=:all: whitesnout || \
            python -m pip install --find-links=dist/ whitesnout

      - name: Import + version check
        shell: bash
        run: |
          python -c "import whitesnout; print('whitesnout', whitesnout.__version__)"
          python -c "from whitesnout import WhiteSnout; from whitesnout import _rs; print('rust ext OK')"

      - name: Serve a static file end-to-end
        shell: bash
        run: |
          python -m pip install uvicorn httpx
          mkdir -p site && echo "hello smoke" > site/index.html
          python -c "
          import asyncio, httpx, uvicorn, threading, time
          from whitesnout import WhiteSnout
          app = WhiteSnout(directory='site')
          cfg = uvicorn.Config(app, host='127.0.0.1', port=18923, log_level='warning')
          srv = uvicorn.Server(cfg)
          t = threading.Thread(target=lambda: asyncio.run(srv.serve()), daemon=True)
          t.start()
          for _ in range(50):
              try:
                  r = httpx.get('http://127.0.0.1:18923/index.html', timeout=1.0)
                  assert r.status_code == 200, r.status_code
                  assert 'hello smoke' in r.text, r.text
                  print('smoke OK')
                  break
              except Exception:
                  time.sleep(0.1)
          else:
              raise SystemExit('server never came up')
          "

  publish:
    needs: [wheels, sdist, smoke-test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/whitesnout
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
