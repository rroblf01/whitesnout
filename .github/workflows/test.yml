name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: target/
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.toml', 'src/lib.rs', 'src/cache.rs', 'src/response.rs', 'src/file_handler.rs', 'src/utils.rs') }}

      - run: uv sync --dev

      - run: uv run pytest -v --cov --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - run: uv sync --dev

      - run: uv run ruff check src/ tests/ benchmarks/

      - run: uv run ruff format --check src/ tests/ benchmarks/

      - run: uv run ty check src/ tests/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target/
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: pip-audit
        run: uv tool run pip-audit --strict --disable-pip
        continue-on-error: true

      - name: cargo audit
        run: cargo audit --deny warnings
        continue-on-error: true
