name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚨 Breaking changes"
    labels:
      - "breaking"
      - "major"
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug fixes"
    labels:
      - "bug"
      - "fix"
  - title: "🔒 Security"
    labels:
      - "security"
  - title: "⚡ Performance"
    labels:
      - "performance"
  - title: "📚 Documentation"
    labels:
      - "documentation"
      - "docs"
  - title: "🧹 Internal"
    labels:
      - "chore"
      - "refactor"
      - "test"
  - title: "📦 Dependencies"
    labels:
      - "dependencies"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - "breaking"
      - "major"
  minor:
    labels:
      - "feature"
      - "enhancement"
      - "minor"
  patch:
    labels:
      - "bug"
      - "fix"
      - "security"
      - "performance"
      - "documentation"
      - "docs"
      - "chore"
      - "refactor"
      - "test"
      - "dependencies"
  default: patch

exclude-labels:
  - "skip-changelog"
  - "duplicate"
  - "invalid"
  - "wontfix"

autolabeler:
  - label: "documentation"
    files:
      - "*.md"
      - "docs/**/*"
  - label: "test"
    files:
      - "tests/**/*"
  - label: "ci"
    files:
      - ".github/**/*"
  - label: "rust"
    files:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  - label: "dependencies"
    files:
      - "pyproject.toml"
      - "uv.lock"
  - label: "breaking"
    title:
      - "/^breaking\\(.*\\):/i"
      - "/^.*!:/"
  - label: "feature"
    title:
      - "/^feat(\\(.*\\))?:/i"
  - label: "bug"
    title:
      - "/^fix(\\(.*\\))?:/i"
  - label: "performance"
    title:
      - "/^perf(\\(.*\\))?:/i"
  - label: "documentation"
    title:
      - "/^docs(\\(.*\\))?:/i"
  - label: "refactor"
    title:
      - "/^refactor(\\(.*\\))?:/i"
  - label: "test"
    title:
      - "/^test(\\(.*\\))?:/i"
  - label: "chore"
    title:
      - "/^chore(\\(.*\\))?:/i"

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
