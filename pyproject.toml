[project]
name = "whitesnout"
version = "1.0.0-dev"
description = "ASGI static file server — like Whitenoise, but for ASGI"
readme = "README.md"
authors = [
    { name = "Ricardo Robles", email = "ricardo.r.f@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = ["aiofiles>=24.1.0"]

[project.optional-dependencies]
compress = ["brotli"]

[project.scripts]
whitesnout = "whitesnout.cli:main"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "whitesnout._rs"
python-source = "src"

[dependency-groups]
dev = [
    "aiofiles>=24.1.0",
    "asgiref>=3.11.1",
    "brotli>=1.2.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
    "ty>=0.0.38",
    "uvicorn>=0.47.0",
    "whitenoise>=6.12.0",
]

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14}-*"
skip = ["*-manylinux_i686", "*-musllinux_i686", "*-win32"]

[tool.cibuildwheel.linux]
# Linux uses Docker containers — Rust must be installed inside them
before-all = "curl -fsSL https://sh.rustup.rs | sh -s -- --default-toolchain stable -y --profile minimal 2>&1"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
# Build both Intel and Apple Silicon from a single runner via cross-compilation
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.12" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ty]
src = { include = ["src", "tests"] }

[tool.ty.analysis]
allowed-unresolved-imports = ["whitesnout._rs"]

[tool.ty.environment]
python-version = "3.10"
