[project]
name = "whitesnout"
version = "2.1.0"
description = "ASGI static file server — like Whitenoise, but native ASGI with a Rust hot path"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ricardo Robles", email = "ricardo.r.f@hotmail.com" }
]
keywords = [
    "asgi",
    "static",
    "files",
    "whitenoise",
    "fastapi",
    "starlette",
    "django",
    "uvicorn",
    "rust",
    "pyo3",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/rrobles-qdq/whitesnout"
Documentation = "https://github.com/rrobles-qdq/whitesnout#readme"
Repository = "https://github.com/rrobles-qdq/whitesnout"
Changelog = "https://github.com/rrobles-qdq/whitesnout/blob/main/CHANGELOG.md"
Issues = "https://github.com/rrobles-qdq/whitesnout/issues"

[project.optional-dependencies]
compress = ["brotli"]
streaming = ["aiofiles>=24.1.0"]

[project.scripts]
whitesnout = "whitesnout.cli:main"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "whitesnout._rs"
python-source = "src"

[dependency-groups]
dev = [
    "a2wsgi>=1.10.0",
    "aiofiles>=24.1.0",
    "asgiref>=3.11.1",
    "brotli>=1.2.0",
    "django>=5.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "hypothesis>=6.122.0",
    "ruff>=0.15.13",
    "ty>=0.0.38",
    "uvicorn>=0.47.0",
    "whitenoise>=6.12.0",
]

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14}-*"
skip = ["*-manylinux_i686", "*-musllinux_i686", "*-win32"]

[tool.cibuildwheel.linux]
# Linux uses Docker containers — Rust must be installed inside them
before-all = "curl -fsSL https://sh.rustup.rs | sh -s -- --default-toolchain stable -y --profile minimal 2>&1"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
# Build both Intel and Apple Silicon from a single runner via cross-compilation
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.12" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/whitesnout"]
branch = true
omit = [
    "src/whitesnout/_rs.pyi",
    "src/whitesnout/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if _RUST_AVAILABLE:",
    "@overload",
]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ty]
src = { include = ["src", "tests"] }

[tool.ty.analysis]
allowed-unresolved-imports = ["whitesnout._rs"]

[tool.ty.environment]
python-version = "3.10"
