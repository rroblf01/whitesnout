[project]
name = "whitesnout"
version = "0.1.0"
description = "ASGI static file server — like Whitenoise, but for ASGI"
readme = "README.md"
authors = [
    { name = "Ricardo Robles", email = "ricardo.r.f@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
compress = ["brotli"]

[project.scripts]
whitesnout = "whitesnout.cli:main"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "whitesnout._rs"
python-source = "src"

[dependency-groups]
dev = [
    "brotli>=1.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14}-*"
skip = ["*-manylinux_i686", "*-musllinux_i686"]
# musllinux is skipped on x86_64/arm64 by default in cibuildwheel

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
