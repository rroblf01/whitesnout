[project]
name = "whitesnout"
version = "0.1.0"
description = "ASGI static file server — like Whitenoise, but for ASGI"
readme = "README.md"
authors = [
    { name = "Ricardo Robles", email = "ricardo.r.f@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
compress = ["brotli"]

[project.scripts]
whitesnout = "whitesnout.cli:main"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "whitesnout._rs"
python-source = "src"

[dependency-groups]
dev = [
    "brotli>=1.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14}-*"
skip = ["*-manylinux_i686", "*-musllinux_i686", "*-win32"]

[tool.cibuildwheel.linux]
# Linux uses Docker containers — Rust must be installed inside them
before-all = "curl -fsSL https://sh.rustup.rs | sh -s -- --default-toolchain stable -y --profile minimal 2>&1"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
# Build both Intel and Apple Silicon from a single runner via cross-compilation
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.9" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
