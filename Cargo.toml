[package]
name = "whitesnout-rs"
version = "2.1.0"
edition = "2021"

[lib]
name = "whitesnout_rs"
crate-type = ["cdylib"]

[dependencies]
# Strict pins: pre-1.0 crates publish breaking changes on minor bumps.
# Bump deliberately and run the test matrix before relaxing.
pyo3 = { version = "=0.23.5", features = ["extension-module", "abi3-py310"] }
regex = "1"
lru = "=0.12.5"
chrono = { version = "=0.4.44", default-features = false, features = ["std"] }
