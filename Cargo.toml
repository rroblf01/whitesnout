[package]
name = "whitesnout-rs"
version = "2.0.1"
edition = "2021"

[lib]
name = "whitesnout_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
regex = "1"
lru = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std"] }
